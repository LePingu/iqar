openapi: 3.0.3
info:
  title: Trader-Strat API
  version: 1.0.0
  description: |
    API specification for the Trader-Strat Control Tower.
    Provides REST endpoints for backtest management and system control, 
    plus WebSocket documentation for live trading streams.

tags:
  - name: System
    description: System status and configuration
  - name: Auth
    description: Current-user identity and control permission
  - name: Backtest
    description: Backtest execution and historical review
  - name: Engine
    description: Live trading engine control (halt / resume / risk limits)
  - name: Oracle
    description: Read-only lineage for agents and service tokens (lots, fills, traces, logs); every read is audited

paths:
  /api/system/status:
    get:
      tags:
        - System
      summary: Get system health and component status
      responses:
        '200':
          description: System status details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'

  /api/system/config:
    get:
      tags:
        - System
      summary: Get active global configuration
      responses:
        '200':
          description: Global configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestConfig'

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Identity + control permission of the current user
      description: |
        Returns the Cloudflare Access-authenticated caller's email and whether
        they may control the engine (``can_control``), derived server-side from
        ENGINE_CONTROL_EMAILS. The frontend calls this on load to render view-only
        vs control UI — it must NOT ship its own email list. Enforcement is
        independent: control endpoints 403 non-operators regardless of the UI.
      responses:
        '200':
          description: Current user identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
        '401':
          description: Missing or invalid Cloudflare Access token

  /api/backtests:
    get:
      tags:
        - Backtest
      summary: List historical backtest runs
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A list of backtest summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BacktestSummary'
    post:
      tags:
        - Backtest
      summary: Queue one named, reviewed F2 backtest condition
      description: |
        The caller selects a preset and variant shown by `GET /api/backtests/presets`.
        Raw CLI flags, paths, image references, provider settings and data locations are
        never accepted from the browser. An operator confirmation in the UI is the launch
        approval; Tower records the request durably and the single Compose worker claims it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestLaunchRequest'
      responses:
        '202':
          description: Backtest job accepted into the durable queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestLaunchAccepted'
        '401':
          description: Missing or invalid Cloudflare Access token
        '403':
          description: Authenticated user is not an engine-control operator
        '409':
          description: CSV dataset is not mounted or registered on the host
        '422':
          description: Unknown condition or browser-supplied fields

  /api/backtests/presets:
    get:
      tags:
        - Backtest
      summary: List named F2 conditions and server execution limits
      responses:
        '200':
          description: Conditions the UI may present for explicit operator confirmation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BacktestPresetInfo'

  /api/backtests/jobs/{job_id}/comparison:
    get:
      tags:
        - Backtest
      summary: Read the recorded comparison for a terminal backtest result
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Baseline/current comparison recorded by the worker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestComparison'
        '404':
          description: Job or comparison artifact is unavailable
        '409':
          description: Job has not reached a terminal result state

  /api/backtests/jobs/{job_id}:
    get:
      tags:
        - Backtest
      summary: Poll durable queued, running, interrupted, or completed job state
      description: |
        Tower creates a `backtest_jobs` record before the worker starts. A queued job has
        no `run_id`; once the worker claims it, it records `run_id` before the runner writes
        its first snapshot. Use `GET /api/backtests/live/{run_id}` for positions, fills and
        equity while the job is running. `progress_pct` is snapshot count divided by target
        decisions when a run record exists. A worker restart marks in-flight work
        `interrupted`; it is never automatically retried.
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status and progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestJobStatus'
        '404':
          description: Run not found in database

  /api/backtests/live:
    get:
      tags:
        - Backtest
      summary: Detect the currently active run and return its live state
      description: |
        A run is "active" if it wrote a `portfolio_snapshots` row within the last 600 seconds
        (a single LLM-heavy decision step can take 150-180s; 600s covers the observed
        worst-case gap with margin without flapping to inactive mid-run).
        Returns 404 when no run is currently active.
        Poll this endpoint on the Live Run Monitor page to auto-attach to whatever run just started
        without knowing the run_id in advance.
        Internally identical to `GET /api/backtests/live/{run_id}` once the run_id is known.
      responses:
        '200':
          description: Live state of the active run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveBacktestDetail'
        '404':
          description: No backtest is currently running
        '503':
          description: SQLite database not found on server

  /api/backtests/live/{run_id}:
    get:
      tags:
        - Backtest
      summary: Live state for any run (active or recently completed) from SQLite
      description: |
        Returns open positions, the last 20 fills, and the full equity curve from
        `portfolio_snapshots.total_value` (one point per decision step, market-timestamped).
        `is_active` is true only while the run is still writing snapshots.
        Use this to poll every 2–3 s on the Live Run Monitor page.
        Once `is_active` becomes false and `portfolio_metrics` is non-null, the run is done —
        navigate to `/backtests/:runId` for the completed-run view.
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
          example: backtest_20260615_094357
      responses:
        '200':
          description: Live detail for the requested run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveBacktestDetail'
        '404':
          description: Run not found in database
        '503':
          description: SQLite database not found on server

  /api/backtests/{run_id}:
    get:
      tags:
        - Backtest
      summary: Get full metrics and asset results for a completed run
      description: |
        `portfolio_history` is sourced from SQLite `portfolio_snapshots` when available
        (one point per decision step, market-timestamped, includes unrealised mark-to-market).
        Falls back to reconstructing from SELL-side trades for runs that predate the DB.
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Complete backtest results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResult'
        '404':
          description: Run directory or required JSON artifacts not found

  /api/backtests/{run_id}/trades:
    get:
      tags:
        - Backtest
      summary: Get paginated trades for a specific backtest (for data grids)
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: symbol
          schema:
            type: string
            description: Filter by asset symbol
      responses:
        '200':
          description: Paginated trades list
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trade'

  /api/backtests/{run_id}/decisions:
    get:
      tags:
        - Backtests
      summary: Decision records for one run, filtered and paged
      description: |
        Same shape as `/api/oracle/{session_id}/decisions`, for a backtest run,
        so one frontend view serves live sessions and runs alike.
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
          description: buy, sell or hold
        - in: query
          name: executed
          schema:
            type: boolean
          description: "true: only decisions that filled or closed lots; false: only the rest"
        - in: query
          name: outcome
          schema:
            type: string
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 500
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A page of decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsResponse'
        '404':
          description: Run not found
  /api/backtests/{run_id}/decisions/{decision_id}:
    get:
      tags:
        - Backtests
      summary: One decision's full path for a run
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
        - in: path
          name: decision_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The decision path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionDetail'
        '404':
          description: Run not found, or no such decision in it
  /api/backtests/{run_id}/assets:
    get:
      tags:
        - Backtest
      summary: List assets traded in a run with per-asset summary stats
      description: |
        Lightweight call to populate the asset sidebar in the chart explorer.
        Returns trade counts and P&L per symbol — no OHLCV data.
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Asset list ordered by total P&L descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetSummary'

  /api/backtests/{run_id}/charts/{symbol}:
    get:
      tags:
        - Backtest
      summary: OHLCV candles + trade markers + regime bands for one asset
      description: |
        Lazy-load endpoint for the chart explorer. Slices the raw 5-min CSV to
        the backtest window only (not the full file, which can be 870k+ rows).
        Fire this only when the user selects an asset — do NOT prefetch all assets.
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
        - in: path
          name: symbol
          required: true
          schema:
            type: string
          example: SOLUSD
      responses:
        '200':
          description: Chart data for one asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartData'

  /api/backtests/jobs/{job_id}/stream:
    get:
      tags:
        - Backtest
      summary: "SSE: stream decisions and rolling metrics while a backtest runs"
      description: |
        Server-Sent Events endpoint. Connect after POST /api/backtests returns a job_id.
        The server polls SQLite on a ~2 s interval and pushes events as decisions are written.
        The stream closes automatically when the job completes or fails.

        Event types emitted on the stream:
        - `decision` — one AIDecision + its execution outcome
        - `metrics`  — rolling portfolio snapshot (ROI, WR, open positions, capital)
        - `done`     — job finished; payload contains the final run_id for redirect
        - `error`    — job failed; payload contains the error message
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Newline-delimited SSE. Examples:
                  data: {"type":"decision","payload":{...AIDecision...}}
                  data: {"type":"metrics","payload":{...Metrics...}}
                  data: {"type":"done","payload":{"run_id":"backtest_20260611_144912"}}

  /api/engine/real/account:
    get:
      summary: Real Kraken account, as the engine last read it
      description: |
        Served from `real_portfolio_snapshots` — the tower holds no exchange
        credentials, so it serves what the engine persisted rather than calling
        Kraken.

        Registered BEFORE `/api/engine/{session_id}/status`, so `real` is never
        captured as a session id.

        Operator-only: a real balance is not viewer information.
      tags: [engine]
      parameters:
        - name: session_id
          in: query
          required: false
          schema:
            type: string
            default: live-real
      responses:
        '200':
          description: The most recent real-account snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealAccountStatus'
        '403':
          description: Caller is not an operator
        '404':
          description: |
            The engine has never read this account. NOT an empty account — do
            not render as $0.

  /api/engine/{session_id}/status:
    get:
      tags:
        - Engine
      summary: Current engine controls and alive status
      description: |
        Reads from ``engine_controls``. ``engine_alive`` is true when the engine
        wrote a portfolio snapshot within the last 10 minutes (2× the default
        cadence, chosen to survive slow LLM cycles).
        ``trading_enabled=false`` means the kill-switch is active.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
          example: live-paper
      responses:
        '200':
          description: Current engine status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineStatus'
        '404':
          description: No engine_controls row for this session — engine has not started
        '503':
          description: Database not found

  /api/engine/{session_id}/detail:
    get:
      tags:
        - Engine
      summary: Live monitoring for a trading-engine session (positions, fills, equity)
      description: |
        The paper/real-trading analogue of GET /api/backtests/live/{run_id}, but
        under the engine namespace. Reads open positions, recent fills, and the
        equity curve from the shared DB tables keyed by session_id. P&L baseline
        is the earliest snapshot (the engine has no fixed "decisions target").
        Open to any user Cloudflare Access admits (share results); only the
        halt/resume/controls endpoints are operator-gated. Poll every 5 s on the
        live dashboard.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
          example: live-paper
      responses:
        '200':
          description: Live engine detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveEngineDetail'
        '404':
          description: No engine session with this id
        '503':
          description: Database not found

  /api/engine/{session_id}/fills:
    get:
      tags:
        - Engine
      summary: Fill history for a session, newest first, paged
      description: |
        `LiveEngineDetail.recent_fills` is the live feed (last 20). This is the
        history: page with `limit`/`offset`, or — while new fills keep arriving at
        the top — with `before_id` set to the smallest `id` on the page you have,
        which never shifts. Reads the session's own table set (a real session's
        fills live in `real_trades`). Open to any user Access admits.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
          example: live-paper
        - in: query
          name: symbol
          schema:
            type: string
        - in: query
          name: side
          schema:
            $ref: '#/components/schemas/TradeSide'
        - in: query
          name: source
          schema:
            type: string
            enum: [engine, exchange]
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          schema:
            type: string
            format: date-time
        - in: query
          name: before_id
          schema:
            type: integer
            minimum: 1
          description: Only fills with an id below this one (cursor paging).
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 500
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A page of fills
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLiveFills'
        '404':
          description: No engine session with this id
        '422':
          description: A filter is malformed, or limit exceeds 500

  /api/engine/{session_id}/halt:
    post:
      tags:
        - Engine
      summary: Queue a halt command (disables trading)
      description: |
        Inserts a ``halt`` row into ``engine_commands``. The engine picks it up at
        the top of its next cycle and sets ``trading_enabled=False``.
        Any open positions are left open — use GET /api/backtests/live/{session_id}
        to monitor them.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Command queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued:
                    type: string
                  session_id:
                    type: string
        '404':
          description: Session not found

  /api/engine/{session_id}/resume:
    post:
      tags:
        - Engine
      summary: Queue a resume command (re-enables trading)
      description: |
        Inserts a ``resume`` row into ``engine_commands``. The engine picks it up at
        the top of its next cycle and sets ``trading_enabled=True``.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Command queued
        '404':
          description: Session not found

  /api/engine/{session_id}/flush:
    post:
      tags:
        - Engine
      summary: Queue a destructive clean-slate portfolio reset
      description: |
        Inserts a ``flush`` row into ``engine_commands``. At the top of its next
        cycle the engine **deletes this session's positions, trades, and
        portfolio_snapshots** and resets its in-memory ledger to starting cash with
        no positions — so it restarts with a clean portfolio even when the database
        already holds positions. The engine process keeps running (HMM/ML-1 models
        stay warm) and the ``trading_enabled`` kill-switch is left unchanged.

        **Destructive and irreversible**: the wiped trade history for this session
        cannot be recovered. Operator-gated (``can_control``). Intended as the
        "start fresh" button before a new paper run. The frontend should confirm
        (e.g. a modal) before calling it.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
          example: live-paper
      responses:
        '200':
          description: Flush command queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued:
                    type: string
                    example: flush
                  session_id:
                    type: string
                  by:
                    type: string
                    description: Operator email that issued the flush
        '403':
          description: Caller is not an operator (can_control=false)
        '404':
          description: Session not found

  /api/engine/{session_id}/controls:
    put:
      tags:
        - Engine
      summary: Queue a risk-limit update
      description: |
        Inserts a ``set_controls`` row into ``engine_commands``. The engine applies
        the new limits at the top of its next cycle without restarting.
        All fields are optional — send only the ones you want to change.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineControls'
      responses:
        '200':
          description: Command queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued:
                    type: string
                  session_id:
                    type: string
                  payload:
                    type: object
        '400':
          description: No fields provided
        '404':
          description: Session not found

  /api/evaluation/{session_id}/run:
    post:
      tags:
        - Evaluation
      summary: Run a live self-evaluation now
      description: |
        Measures the session's book against an equal-weight hold of the symbols it
        actually traded, using hourly closes fetched fresh from the exchange at
        request time.

        **This is the button.** It takes tens of seconds — it walks hourly bars for
        every symbol the session traded — so render a pending state rather than a
        spinner that looks hung. The response carries `digest`, a markdown summary
        sized to paste into a chat or an issue; offer it as both copy-to-clipboard
        and a download via `/api/evaluation/reports/{id}/download`.

        Prices are fetched fresh on every run, never reused from the engine's own
        decision traces: those sample the market only when the engine happens to run
        a cycle, and a benchmark measured on the system's own clock is not a
        benchmark.

        The report is stored either way. If the exchange is unreachable, the response
        is still `200` with `error` set and `capture_ratio: null` — render the error,
        and never substitute `0` for a missing measurement.

        Requires a control user (same bar as halting the engine).
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - in: query
          name: window_days
          required: false
          description: Days of history to evaluate. Defaults to TOWER_EVAL_WINDOW_DAYS (30).
          schema:
            type: integer
            minimum: 1
            maximum: 120
        - in: query
          name: since
          required: false
          description: |
            Start of an explicit range. Overrides `window_days`: use it to measure
            one specific stretch (a run between two deployments) rather than "the
            last N days". The range may not exceed 120 days.
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          required: false
          description: End of an explicit range. Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Evaluation complete (check `error` — it may be a recorded failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationReportResponse'
        '403':
          description: Not a control user
        '422':
          description: window_days out of range, since after until, or a range wider than 120 days

  /api/evaluation/{session_id}/latest:
    get:
      tags:
        - Evaluation
      summary: Most recent stored evaluation
      description: |
        Reads back the last report without recomputing. `404` means none has been
        run yet — prompt the operator to run one rather than rendering zeros.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The stored report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationReportResponse'
        '404':
          description: No evaluation stored for this session yet

  /api/evaluation/{session_id}/history:
    get:
      tags:
        - Evaluation
      summary: Headline figures over time
      description: |
        Summaries only — no `digest`, no `payload` — so the list stays small enough
        to chart. One capture ratio is a number; a month of them is a trend, which
        is the point of keeping them.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationSummary'

  /api/evaluation/{session_id}/curves:
    get:
      tags:
        - Evaluation
      summary: The book's equity beside the market, as aligned series
      description: |
        Equal-weight hold of what the engine traded, BTC and the exposure-matched
        replica on one hourly grid with the book, indexed to 100 at the start of
        the latest stretch with no book rebuild in it, plus every engine fill as
        a marker linked to its decision. A read (prices cached 15 minutes), so a
        dashboard may poll it. `502` when the benchmark venue is unreachable —
        render the reason, never a flat line.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - in: query
          name: window_days
          schema:
            type: integer
            minimum: 1
            maximum: 120
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The curves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationCurves'
        '404':
          description: Unknown session
        '422':
          description: since does not precede until
        '502':
          description: Benchmark venue unreachable
  /api/evaluation/reports/{report_id}/download:
    get:
      tags:
        - Evaluation
      summary: Download one evaluation as a markdown file
      description: |
        Returns the digest as `text/markdown` with a `Content-Disposition`
        attachment header, named `evaluation_<session>_<timestamp>.md`. Link to it
        directly; no need to fetch and re-wrap it in the client.
      parameters:
        - in: path
          name: report_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The digest
          content:
            text/markdown:
              schema:
                type: string
        '404':
          description: No such report

  # ── Oracle: read-only lineage for machine identities ────────────────────
  /api/oracle/sessions:
    get:
      tags:
        - Oracle
      summary: Discover engine sessions
      description: |
        The oracle's entry point. Read-only by construction: no oracle route
        writes money state, queues a command or reaches an exchange. Every
        served request writes one audit row (identity, route, filters, rows
        returned); a read that cannot be audited is refused.

        Auth: any Access-authenticated identity — a human login or a Cloudflare
        Access **service token** (the oracle's reason to exist). Service
        identities can read here and are rejected by every control endpoint.
      responses:
        '200':
          description: One entry per engine session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OracleSessionSummary'
        '401':
          description: Missing or invalid Access token
  /api/oracle/{session_id}/lots:
    get:
      tags:
        - Oracle
      summary: The lot ledger, paginated
      description: |
        Lots of the session's own position table (paper or real_*). Filter by
        symbol and open/closed; the page is bounded.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          required: false
          description: Filter by one symbol, e.g. MINAUSD
          schema:
            type: string
        - in: query
          name: status
          required: false
          description: "'open', 'closed', or all (default)"
          schema:
            type: string
            enum: [open, closed]
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of lots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleLotsResponse'
        '404':
          description: Unknown session
  /api/oracle/{session_id}/lots/{lot_id}/lineage:
    get:
      tags:
        - Oracle
      summary: One lot, its fills, and where its reasoning lives
      description: |
        The lot row (regime at both ends, stop state, basis), its fills, and
        the decision-trace files being written while it was open — the DB says
        WHAT happened to the lot, the traces say WHY.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - in: path
          name: lot_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The lineage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotLineage'
        '404':
          description: Unknown session, or no such lot in it
  /api/oracle/{session_id}/decisions:
    get:
      tags:
        - Oracle
      summary: The session's decision records, filtered and paged
      description: |
        Every decision the orchestrator produced, newest first, executed or not —
        a buy the governor refused is a row with `outcome=gate_governor`, so the
        book of what was declined is as queryable as the book of what was bought.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
          description: buy, sell or hold
        - in: query
          name: executed
          schema:
            type: boolean
          description: "true: only decisions that filled or closed lots; false: only the rest"
        - in: query
          name: outcome
          schema:
            type: string
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 500
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A page of decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsResponse'
        '404':
          description: Unknown session
  /api/oracle/{session_id}/decisions/{decision_id}:
    get:
      tags:
        - Oracle
      summary: One decision's full path
      description: |
        Inputs, verdicts, the adjustment sequence, the outcome, and the lots and
        fills that point back at this decision.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - in: path
          name: decision_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The decision path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionDetail'
        '404':
          description: Unknown session, or no such decision in it
  /api/oracle/{session_id}/traces:
    get:
      tags:
        - Oracle
      summary: Which decision-trace files exist for the session
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace files, newest last
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TraceFileInfo'
        '404':
          description: Unknown session
  /api/oracle/{session_id}/traces/records:
    get:
      tags:
        - Oracle
      summary: Slimmed decision-trace records, filtered and capped
      description: |
        Scans the session's trace files newest-first up to a fixed line cap,
        drops bulk fields, and returns at most `limit` matching records.
        `truncated` says the cap was hit before the files were exhausted.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          required: false
          description: Keep only records about this symbol
          schema:
            type: string
        - in: query
          name: record_type
          required: false
          description: Keep only this record type
          schema:
            type: string
            enum: [LLM_PROMPT, ALGO_INPUT, DECISION, ERROR]
        - in: query
          name: since
          required: false
          description: ISO 8601 lower bound (URL-encode the offset)
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          required: false
          description: ISO 8601 upper bound
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: keep_prompts
          required: false
          description: Keep LLM prompt text (capped per prompt). Default drops it.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Matching records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceRecordsResponse'
        '404':
          description: Unknown session
        '422':
          description: since does not precede until, or a bound is out of range
  /api/oracle/{session_id}/llm-calls:
    get:
      tags:
        - Oracle
      summary: Recent LLM calls from the shared call log
      description: |
        The call log is shared by every engine process and carries no session
        id, so the answer is filtered by symbol/agent only — never by session.
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          required: false
          schema:
            type: string
        - in: query
          name: agent
          required: false
          description: e.g. pattern_detector, position_manager
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Recent entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmCallsResponse'
        '404':
          description: Unknown session
  /api/oracle/{session_id}/continuity:
    get:
      tags:
        - Oracle
      summary: Snapshot continuity — coverage, gaps, lying rows
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - in: query
          name: gap_minutes
          required: false
          description: A stretch longer than this with no snapshot is reported as a gap
          schema:
            type: number
            minimum: 1
            maximum: 1440
            default: 30
        - in: query
          name: days
          required: false
          description: Window to cover
          schema:
            type: integer
            minimum: 1
            maximum: 120
            default: 30
      responses:
        '200':
          description: The continuity report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityReport'
        '404':
          description: Unknown session
  /api/oracle/{session_id}/log:
    get:
      tags:
        - Oracle
      summary: Bounded tail of the session's newest engine log
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
        - in: query
          name: lines
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: The last lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogTailResponse'
        '404':
          description: Unknown session, or no engine log for it yet


components:
  schemas:
    EngineStatus:
      type: object
      description: |
        Current state of the live trading engine for a session.
        Poll ``GET /api/engine/{session_id}/status`` every 15–30 s from the control panel.
      properties:
        mode:
          type: string
          enum: [paper, real]
          default: paper
          description: |
            Which book this session runs. Also selects the table set every other
            engine endpoint serves for it — and `engine_alive` is computed
            against that same set, so a real engine is not reported dead for
            writing its heartbeat where it was supposed to.
        session_id:
          type: string
        trading_enabled:
          type: boolean
          description: Kill-switch state — false means the engine will not submit any orders
        engine_alive:
          type: boolean
          description: True when a snapshot was written within the last 10 minutes
        max_position_size_pct:
          type: number
          description: Maximum order size as a fraction of portfolio value (0–1)
        max_daily_loss_pct:
          type: number
          description: Daily loss limit as a fraction of starting capital (0–1)
        max_open_positions:
          type: integer
          description: Maximum number of simultaneously open positions
        last_snapshot_ts:
          type: string
          nullable: true
          description: ISO 8601 timestamp of the most recent portfolio snapshot

    EngineControls:
      type: object
      description: |
        Risk limit update payload for ``PUT /api/engine/{session_id}/controls``.
        All fields are optional — include only the ones you want to change.
      properties:
        max_position_size_pct:
          type: number
          nullable: true
          description: 0–1 fraction of portfolio value per position
        max_daily_loss_pct:
          type: number
          nullable: true
          description: 0–1 fraction of starting capital
        max_open_positions:
          type: integer
          nullable: true
          description: Hard cap on simultaneously open positions

    LiveEngineDetail:
      type: object
      description: |
        Live monitoring payload for a trading-engine session — the paper/real
        analogue of LiveBacktestDetail. Sourced entirely from the DB (positions,
        trades, portfolio_snapshots) keyed by session_id. No backtest "decisions
        target" concept; the engine runs open-endedly.
      properties:
        mode:
          type: string
          enum: [paper, real]
          default: paper
          description: Which book this payload describes; selects the source tables.
        currency:
          type: string
          default: USD
          description: |
            Denomination of every monetary field here. Render it beside the
            numbers — a real balance with no currency on it is not a figure
            anyone should act on.
        observed_from:
          type: string
          nullable: true
          description: |
            First snapshot this session recorded. For a real account that is when
            the **engine started watching**, not when the account started trading:
            there is no equity curve before this point, and it must not be drawn
            as flat or as zero.
        session_id:
          type: string
        trading_enabled:
          type: boolean
          description: Kill-switch state (false = halted)
        is_active:
          type: boolean
          description: True when a snapshot was written within the last 10 minutes
        portfolio_value:
          type: number
        pnl:
          type: number
          description: Absolute P&L vs the earliest snapshot (starting capital)
        pnl_pct:
          type: number
        drawdown_pct:
          type: number
        open_positions_count:
          type: integer
        last_snapshot_ts:
          type: string
          nullable: true
        open_positions:
          type: array
          items:
            $ref: '#/components/schemas/OpenPosition'
        recent_fills:
          type: array
          items:
            $ref: '#/components/schemas/LiveFill'
        equity_curve:
          type: array
          items:
            $ref: '#/components/schemas/EquityPoint'

    SystemStatus:
      type: object
      properties:
        rust_core_version:
          type: string
        rust_simd_enabled:
          type: boolean
        database_size_mb:
          type: number
        llm_api_latency_ms:
          type: number
        active_agents:
          type: integer

    WhoAmI:
      type: object
      required:
        - email
        - can_control
      properties:
        email:
          type: string
          description: The Cloudflare Access-verified email of the current user.
        can_control:
          type: boolean
          description: >-
            True if this user is in ENGINE_CONTROL_EMAILS and may hit
            engine-control endpoints; false for read-only viewers.

    SignalType:
      type: string
      enum:
        - strong_buy
        - buy
        - weak_buy
        - strong_sell
        - sell
        - weak_sell
        - strong_short
        - short
        - hold
        - close
        - bullish_reversal
        - bearish_reversal
        - neutral

    TradeSide:
      type: string
      enum: [BUY, SELL]

    MarketRegime:
      type: string
      enum:
        - trend_up
        - sideways
        - trend_down
        - unknown

    BacktestConfig:
      type: object
      properties:
        initial_capital:
          type: number
          default: 10000.0
        transaction_fee:
          type: number
          default: 0.0026
        slippage_pct:
          type: number
          default: 0.001
          description: One-way slippage applied at fill price (0.1% default)
        max_positions:
          type: integer
          default: 15
        max_position_pct:
          type: number
          default: 0.2
        target_decisions:
          type: integer
          default: 130
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        enable_short_selling:
          type: boolean
        enable_compounding:
          type: boolean
        enable_trailing_stops:
          type: boolean
          default: true
        disable_ai_exits:
          type: boolean
          default: true
          description: Suppress AI-driven sell signals; trailing stops are sole exit
        pattern_analysis_enabled:
          type: boolean
          default: true
        risk_assessment_enabled:
          type: boolean
          default: true
        sentiment_analysis_enabled:
          type: boolean
          default: false
        correlation_analysis_enabled:
          type: boolean
          default: true
        fixed_universe_enabled:
          type: boolean
          default: true
          description: Pin T0–T3 assets; scanner becomes tagger only
        dual_portfolio_enabled:
          type: boolean
          default: true
          description: 80% quality / 20% meme bucket split
        regime_continuous_enabled:
          type: boolean
          default: true
          description: Smooth ramp over P(trend_up) replacing hard 0.70 cliff
        position_rotation_enabled:
          type: boolean
          default: true
          description: M9.D — rotate out weakest position when book full and higher-conviction signal arrives
        mock_critic:
          type: boolean
          default: false
          description: Stub LLM to always agree; use for deterministic gate runs
        critic_sideways_asset_aware_enabled:
          type: boolean
          default: false
          description: >-
            Sideways-regime critic judges each asset on its own evidence instead of
            rejecting solely on the market-wide HMM regime label (Aug 2026 live-paper
            root cause: market-wide regime blind to per-asset dispersion)
        anti_averaging_down_enabled:
          type: boolean
          default: true
          description: Block adding to a position that is already losing
        vol_trail_enabled:
          type: boolean
          default: false
          description: "P2 — ATR-scaled trailing stop width (trail = adaptive stop × multiplier); when off the executor uses a fixed 3% trail"
        vol_trail_multiplier:
          type: number
          default: 1.0
          description: Scales the ATR-derived stop distance; only used when vol_trail_enabled=true
        vol_trail_floor:
          type: number
          default: 0.02
          description: Minimum trail width (2%); prevents whipsaw on low-vol assets
        vol_trail_ceiling:
          type: number
          default: 0.15
          description: Maximum trail width (15%); caps ultra-vol spike exposure

    Metrics:
      type: object
      properties:
        roi:
          type: number
        total_pnl:
          type: number
        sharpe_ratio:
          type: number
        max_drawdown:
          type: number
        total_trades:
          type: integer
        winning_trades:
          type: integer
        losing_trades:
          type: integer
        win_rate:
          type: number
        avg_win:
          type: number
        avg_loss:
          type: number
        avg_trade_pnl:
          type: number
        avg_hold_duration_hours:
          type: number
        final_capital:
          type: number
        peak_capital:
          type: number
        max_concurrent_positions:
          type: integer
        buy_and_hold_roi:
          type: number
          description: Equal-weight buy-and-hold ROI for the traded universe
        capture_ratio:
          type: number
          description: System ROI ÷ buy-and-hold ROI; target ≥ 1.0 for positive alpha

    Trade:
      type: object
      properties:
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/TradeSide'
        size:
          type: number
        price:
          type: number
        timestamp:
          type: string
          format: date-time
        pnl:
          type: number
        pnl_pct:
          type: number
        hold_duration_hours:
          type: number
        reason:
          type: string

    Position:
      type: object
      properties:
        id:
          type: integer
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/TradeSide'
        size:
          type: number
        entry_price:
          type: number
        entry_time:
          type: string
          format: date-time
        unrealized_pnl:
          type: number
        unrealized_pnl_pct:
          type: number
        trailing_stop_active:
          type: boolean
        trailing_stop_price:
          type: number

    AIDecision:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        symbol:
          type: string
        signal:
          $ref: '#/components/schemas/SignalType'
        confidence:
          type: number
        price:
          type: number
        pm_position_size:
          type: number
        pm_stop_loss:
          type: number
        pm_take_profit:
          type: number

    BacktestLaunchRequest:
      type: object
      additionalProperties: false
      required: [preset, variant]
      properties:
        preset:
          type: string
          example: f2
        variant:
          type: string
          example: rotation-off

    BacktestPresetInfo:
      type: object
      required: [preset, variant, description, parameters, historical_baseline_run_id, estimated_minutes_min, estimated_minutes_max, max_parallel]
      properties:
        preset:
          type: string
        variant:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        historical_baseline_run_id:
          type: string
        estimated_minutes_min:
          type: integer
        estimated_minutes_max:
          type: integer
        max_parallel:
          type: integer
          description: Current host limit; the UI must not imply additional parallel capacity.

    BacktestLaunchAccepted:
      type: object
      required: [job_id, status, preset, variant, dataset_id, historical_baseline_run_id, estimated_minutes_min, estimated_minutes_max, max_parallel]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued]
        preset:
          type: string
        variant:
          type: string
        dataset_id:
          type: string
        historical_baseline_run_id:
          type: string
        estimated_minutes_min:
          type: integer
        estimated_minutes_max:
          type: integer
        max_parallel:
          type: integer

    BacktestComparison:
      type: object
      description: Worker-generated baseline/current evidence. Fields vary when a baseline artifact is unavailable.
      additionalProperties: true

    BacktestJobStatus:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, interrupted]
        preset:
          type: string
          nullable: true
        variant:
          type: string
          nullable: true
        dataset_id:
          type: string
          nullable: true
        historical_baseline_run_id:
          type: string
          nullable: true
        run_id:
          type: string
          nullable: true
          description: Populated before the runner starts; use it with GET /api/backtests/live/{run_id}.
        progress_pct:
          type: number
          nullable: true
          description: 0–100 while a run record has snapshots
        created_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        exit_code:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true

    AssetSummary:
      type: object
      description: Per-asset summary for the runs browser sidebar. No OHLCV included.
      properties:
        symbol:
          type: string
        trades:
          type: integer
        win_rate:
          type: number
        pnl:
          type: number
        roi:
          type: number
        regime_coverage:
          type: object
          description: Fraction of decisions per HMM regime for this asset
          properties:
            trend_up:
              type: number
            sideways:
              type: number
            trend_down:
              type: number

    OHLCVCandle:
      type: object
      properties:
        time:
          type: integer
          description: Unix timestamp in seconds (TradingView Lightweight Charts format)
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number

    TradeMarker:
      type: object
      description: Entry or exit event to overlay as a marker on the candlestick chart
      properties:
        time:
          type: integer
          description: Unix timestamp in seconds
        side:
          $ref: '#/components/schemas/TradeSide'
        price:
          type: number
        pnl:
          type: number
          nullable: true
          description: Null for entries; realised P&L for exits
        reason:
          type: string
          description: "Exit reason: trailing_stop | ai_exit | end_of_backtest | rotation | hard_stop"

    RegimeBand:
      type: object
      description: HMM regime segment rendered as a coloured background band on the chart
      properties:
        start_time:
          type: integer
          description: Unix timestamp in seconds
        end_time:
          type: integer
          description: Unix timestamp in seconds
        regime:
          $ref: '#/components/schemas/MarketRegime'
        confidence:
          type: number
          description: HMM posterior probability for this label

    ChartData:
      type: object
      properties:
        symbol:
          type: string
        candles:
          type: array
          items:
            $ref: '#/components/schemas/OHLCVCandle'
          description: 5-min OHLCV sliced to the backtest window only
        markers:
          type: array
          items:
            $ref: '#/components/schemas/TradeMarker'
          description: All entry and exit events for this symbol in this run
        regime_bands:
          type: array
          items:
            $ref: '#/components/schemas/RegimeBand'
          description: HMM regime segments as background colour bands

    EquityPoint:
      type: object
      description: |
        One point on the portfolio equity curve.
        Source for completed runs: SQLite `portfolio_snapshots.total_value` (one point per
        decision step, market-timestamped, includes unrealised mark-to-market).
        Fallback for pre-DB runs: reconstructed from SELL-side trades only (realised P&L steps).
      properties:
        time:
          type: integer
          description: Unix timestamp in seconds
        capital:
          type: number
        roi_pct:
          type: number

    BacktestSummary:
      type: object
      description: Row in the runs browser table. Includes config flags so the flag chip column can render without a second request.
      properties:
        run_id:
          type: string
        timestamp:
          type: string
          format: date-time
        metrics:
          $ref: '#/components/schemas/Metrics'
        config:
          $ref: '#/components/schemas/BacktestConfig'

    AssetResult:
      type: object
      properties:
        symbol:
          type: string
        trades:
          type: integer
        capital_invested:
          type: number
        metrics:
          $ref: '#/components/schemas/Metrics'

    BacktestResult:
      type: object
      properties:
        run_id:
          type: string
        timestamp:
          type: string
          format: date-time
        config:
          $ref: '#/components/schemas/BacktestConfig'
        portfolio_metrics:
          $ref: '#/components/schemas/Metrics'
        asset_results:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AssetResult'
        portfolio_history:
          type: array
          items:
            $ref: '#/components/schemas/EquityPoint'
          description: |
            Time-series equity curve. Sourced from SQLite portfolio_snapshots when available
            (richer cadence, includes unrealised value); falls back to SELL-event reconstruction.

    OpenPosition:
      type: object
      description: An open position as recorded in SQLite at the last decision step
      properties:
        basis_source:
          type: string
          enum: [traded, adopted, reconstructed]
          default: traded
          description: |
            Where `entry_price` came from, and therefore what `unrealized_pnl_pct`
            MEANS. `traded` — this engine opened the lot, so P&L is lifetime.
            `adopted` — the lot already existed on the exchange when the engine
            took the account over, so `entry_price` is the mark at `adopted_at`
            and P&L is measured **from adoption**, not lifetime return. Render the
            difference: an adopted lot shown as lifetime return is a wrong number,
            not a missing one.
        adopted_at:
          type: string
          nullable: true
          description: When the engine adopted a pre-existing lot. Null for traded lots.
        venue_market:
          type: string
          nullable: true
          description: |
            The venue pair this asset actually traded on — `PENGU/EUR` for a
            position the book calls `PENGUUSD`. Internal symbols are always
            `<BASE>USD` because the analytics stack is USD-denominated and the
            symbol names a price *series*, not a settlement pair. Show this as the
            reference an operator can tie back to their exchange statement. Null
            for engine-opened lots, which settled in the accounting currency.
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/TradeSide'
        quantity:
          type: number
        entry_price:
          type: number
        current_price:
          type: number
          description: Mark-to-market price at the most recent snapshot
        unrealized_pnl_pct:
          type: number
          description: (current_price − entry_price) / entry_price × 100
        trailing_stop_active:
          type: boolean
        trailing_stop_price:
          type: number
          nullable: true

    RealAccountStatus:
      type: object
      description: |
        The real Kraken account as the **engine** last read it.

        Served from `real_portfolio_snapshots`, NOT by calling Kraken. The tower
        holds no exchange credentials by design — the key lives on the engine,
        which is the only component that talks to Kraken — so the engine
        persists each read and the tower serves it.

        Two consequences for the UI:
          * The view keeps working while the engine is stopped. It is showing
            history, not proxying a live API.
          * `as_of` is the age of the READ, not of the request. A stale
            timestamp means the engine is not running — surface that rather than
            presenting an old balance as if it were current.

        `404` means the engine has never read this account. That is NOT an empty
        account and must not be rendered as $0.

        **Arming state is not here.** LIVE_MODE / LIVE_KRAKEN_ARMED /
        LIVE_KRAKEN_VALIDATE_ONLY / the per-order cap are engine configuration,
        and this endpoint serves a persisted portfolio snapshot that does not
        carry them. The real-money screen still needs them — from a source that
        actually knows, which does not exist yet. Do NOT infer "unarmed" from
        their absence.
      properties:
        as_of:
          type: string
          description: When the engine read the account (ISO 8601). Not request time.
        currency:
          type: string
          default: USD
          description: |
            What every monetary field below is denominated in. Render it beside
            the numbers — a real balance with no currency on it is not a figure
            anyone should act on. The audited account's own Kraken screen reports
            GBP while the book accounts in USD, and the two differ by ~35%.
        quote_cash:
          type: number
          nullable: true
          description: |
            Free balance of `currency` as the exchange reported it. Other fiat
            the account holds is real money but needs a conversion to spend, so
            it is counted in `positions_value`, not here.
        positions_value:
          type: number
          nullable: true
          description: |
            Coins valued at the marks of the cycle that wrote the snapshot, plus
            any non-`currency` fiat the account holds. Separate from cash because
            on a real account the coins are usually most of the portfolio. A holding the engine could not price is
            EXCLUDED from this figure (and logged) rather than valued at zero,
            so when it covers fewer assets than `num_holdings`, `total_value` is
            a floor rather than a valuation.
        total_value:
          type: number
          nullable: true
          description: "`quote_cash` + `positions_value`. See the caveat above."
        num_holdings:
          type: integer
          nullable: true
          description: |
            Count of non-quote balances held at the exchange. Per-asset balances
            and open orders are deliberately NOT exposed: the engine reads them
            from Kraken but the snapshot row does not store them, and empty
            lists would claim "no holdings, no open orders" for an account that
            may have both.

    LiveFill:
      type: object
      description: |
        A fill (buy or sell) from the `trades` table.

        **Prices are unrounded.** The column is `Numeric(20, 8)` and the API no
        longer truncates, because a fixed decimal count destroys sub-cent assets
        before the client sees them (0.0000012345 rounded to 6dp is 0.000001 —
        one significant digit out of five). Apply the significant-digit display
        rule in FRONTEND_AGENT_CONTEXT.md rather than assuming 2dp.
      properties:
        source:
          type: string
          enum: [engine, exchange]
          default: engine
          description: |
            `engine` — this engine placed the order. `exchange` — read back from
            the venue's own trade history, so it covers fills the engine never
            made: a manual trade in the exchange app, or anything from before the
            engine existed. A dashboard that does not distinguish them attributes
            a hand trade to the strategy.
        settle_currency:
          type: string
          nullable: true
          description: |
            What the fill actually settled in, when that differs from the book's
            accounting currency — the real account has settled on GBP, EUR and USD
            pairs. `price` is always in accounting currency; this says what it was
            converted from. Null on an engine fill.
        settle_fx_rate:
          type: number
          nullable: true
          description: |
            Rate used for that conversion, taken from the fill's own date rather
            than today's. **Null on a non-accounting-currency fill means no rate
            was available and `price` is UNCONVERTED** — flag it rather than
            showing it beside converted numbers as if comparable.
        venue_market:
          type: string
          nullable: true
          description: The venue pair the money moved through, e.g. `PENGU/EUR`.
        settle_price:
          type: number
          nullable: true
          description: |
            Price as the venue reported it, in `settle_currency`, before
            conversion — e.g. `0.0334` for a PENGU/EUR fill whose `price` is the
            USD equivalent. Show it beside `price` as the figure an operator can
            check against their exchange statement.
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/TradeSide'
        price:
          type: number
        quantity:
          type: number
        timestamp:
          type: string
          description: Market timestamp of the fill (ISO 8601)
        realized_pnl:
          type: number
          nullable: true
          description: |
            Realized P&L in quote currency. Present on **SELL** fills only;
            `null` on BUYs. A BUY's stored pnl is just its fee, which would
            render as a small loss on every entry and read as though the trade
            had already gone wrong — so it is deliberately not surfaced.
        realized_pnl_pct:
          type: number
          nullable: true
          description: Realized P&L as a percentage. SELL fills only; null on BUYs.
        id:
          type: integer
          nullable: true
          description: |
            The trade row's id — a stable key for a paged list, and what a client
            passes as `before_id` to page further back.
        position_id:
          type: integer
          nullable: true
          description: The lot this fill opened or closed (see the oracle's lots / lineage).
        decision_id:
          type: string
          nullable: true
          description: |
            The orchestrator decision this fill executed — open it with
            `GET /api/oracle/{session_id}/decisions/{decision_id}`. Null for a
            mechanical exit (stop / trail / force-close) or a venue-side fill.
        reason:
          type: string
          nullable: true
          description: |
            The close reason on a SELL (`trailing_stop`, `hard_stop`, `ai_signal_market`,
            `rotation`, ...); `signal` on an engine BUY; `exchange_history` on an ingested row.
        commission:
          type: number
          nullable: true
    PaginatedLiveFills:
      type: object
      description: |
        A page of a session's fills, newest first — the way back in time that
        `LiveEngineDetail.recent_fills` (the last 20, for the live feed) is not.
        `total_matching` counts every fill the filters admit, so a client can page
        to the end without guessing.
      properties:
        session_id:
          type: string
        mode:
          type: string
          description: paper or real — which table set the fills came from.
        total_matching:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        fills:
          type: array
          items:
            $ref: '#/components/schemas/LiveFill'
      required: [session_id, mode, total_matching, limit, offset, fills]

    LiveSnapshot:
      type: object
      description: |
        Current portfolio state derived from the latest `portfolio_snapshots` row.
        All monetary values are in the run's base currency (USD).
      properties:
        portfolio_value:
          type: number
          description: Total mark-to-market portfolio value
        pnl:
          type: number
          description: Absolute P&L vs initial capital
        pnl_pct:
          type: number
          description: Percentage P&L vs initial capital
        drawdown_pct:
          type: number
          description: Maximum drawdown from peak so far, as a percentage
        open_positions_count:
          type: integer
        decisions_done:
          type: integer
          description: Number of decision steps completed (= snapshot count)
        decisions_target:
          type: integer
          description: Total decision steps configured for this run
        last_snapshot_ts:
          type: string
          description: Market timestamp of the most recent snapshot (ISO 8601)

    LiveBacktestDetail:
      type: object
      description: |
        Full live view of a running or recently completed backtest.
        Sourced entirely from SQLite — no JSON file dependency except `run_metadata.json`
        (for config) and `portfolio_summary.json` (for final metrics, only after completion).
      properties:
        run_id:
          type: string
        is_active:
          type: boolean
          description: True while the run is still writing snapshots (within last 60 s)
        config:
          $ref: '#/components/schemas/BacktestConfig'
          nullable: true
          description: Null if run_metadata.json is not yet written
        snapshot:
          $ref: '#/components/schemas/LiveSnapshot'
          nullable: true
        open_positions:
          type: array
          items:
            $ref: '#/components/schemas/OpenPosition'
          description: All currently open positions, ordered by unrealised P&L descending
        recent_fills:
          type: array
          items:
            $ref: '#/components/schemas/LiveFill'
          description: Last 20 fills, newest first
        equity_curve:
          type: array
          items:
            $ref: '#/components/schemas/EquityPoint'
          description: Full portfolio value time series from portfolio_snapshots
        portfolio_metrics:
          $ref: '#/components/schemas/Metrics'
          nullable: true
          description: Non-null only after the run completes and portfolio_summary.json is written

    EvaluationSummary:
      type: object
      description: |
        Headline figures of one stored evaluation — enough for a history row or a
        card, without the full payload.

        **Every numeric field is nullable and that is load-bearing.** A window whose
        benchmark venue was unreachable still produces a valid report; it simply
        cannot state a capture ratio. Rendering `null` as `0` would turn "not
        measured" into "measured as zero", which is the exact failure this whole
        endpoint exists to stop.
      properties:
        id:
          type: integer
        session_id:
          type: string
        mode:
          type: string
          enum: [paper, real]
          description: Which table set this evaluation read.
        trigger:
          type: string
          enum: [scheduled, manual]
        generated_at:
          type: string
          format: date-time
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        return_pct:
          type: number
          nullable: true
          description: Book return over the measured stretch, in percent.
        benchmark_pct:
          type: number
          nullable: true
          description: Equal-weight hold of the symbols actually traded, in percent.
        capture_ratio:
          type: number
          nullable: true
          description: |
            `return_pct / benchmark_pct`. The roadmap's G6 gate is 0.50 in bull;
            above 1.0 is positive alpha. Null when there was no benchmark coverage
            **and null whenever `benchmark_pct` is below +1%**: a ratio to a flat
            or falling hold is meaningless (two negatives read as a win), so lead
            with `alpha_pp` and show the ratio only when present.
        alpha_pp:
          type: number
          nullable: true
          description: |
            `return_pct − benchmark_pct`, in percentage points. The headline: always
            defined when a benchmark is, whatever its sign. Null only when the
            benchmark could not be fetched.
        checks_failed:
          type: integer
          description: Count of failing invariants (position cap, realized_pnl written, etc).
        error:
          type: string
          nullable: true
          description: Why this run could not measure. Present means the row is a recorded failure.
      required: [id, session_id, mode, trigger, generated_at, window_start, window_end, checks_failed]

    EvaluationReportResponse:
      type: object
      description: |
        A full evaluation — every EvaluationSummary field, plus the pasteable digest
        and the structured payload behind it.

        Written out in full rather than composed with `allOf` so the published
        contract lists the properties a client actually receives; the drift test
        that guards this file compares declared properties field-by-field.
      properties:
        id:
          type: integer
        session_id:
          type: string
        mode:
          type: string
          enum: [paper, real]
        trigger:
          type: string
          enum: [scheduled, manual]
        generated_at:
          type: string
          format: date-time
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        return_pct:
          type: number
          nullable: true
        benchmark_pct:
          type: number
          nullable: true
        capture_ratio:
          type: number
          nullable: true
          description: |
            Null when there was no benchmark coverage, and null whenever the hold
            is below +1% — lead with `alpha_pp`. Never render null as 0.
        alpha_pp:
          type: number
          nullable: true
          description: return_pct − benchmark_pct in percentage points; see EvaluationSummary.
        checks_failed:
          type: integer
        error:
          type: string
          nullable: true
        digest:
          type: string
          description: |
            Markdown summary, sized to paste into a chat message. This is what
            /api/evaluation/reports/{id}/download serves as a file.
        payload:
          type: object
          additionalProperties: true
          description: |
            The structured report: segment, discontinuities, per-symbol
            participation, exit-path forward returns, and the invariant checks.
      required: [id, session_id, mode, trigger, generated_at, window_start, window_end, checks_failed, digest]

    # ── Oracle (read-only lineage for agents; see /api/oracle/*) ──────────
    OracleSessionSummary:
      type: object
      description: |
        One engine session as the oracle sees it — the discovery entry point.
        open_lots / closed_lots come from the session's own position table (paper
        or real_*), so the counts are comparable within a mode, not across modes.
      properties:
        session_id:
          type: string
        mode:
          type: string
        trading_enabled:
          type: boolean
        max_open_positions:
          type: integer
        last_snapshot_ts:
          type: string
          nullable: true
        open_lots:
          type: integer
        closed_lots:
          type: integer
      required: [session_id, mode, trading_enabled, max_open_positions]
    OracleLot:
      type: object
      description: |
        One lot of the ledger — the DB row a lineage query chains from. Prices are
        NOT rounded to a fixed decimal count (the DB holds Numeric(20, 8); fixed
        decimals destroy sub-cent assets).
      properties:
        id:
          type: integer
        symbol:
          type: string
        side:
          type: string
        quantity:
          type: number
        entry_price:
          type: number
        entry_timestamp:
          type: string
        current_price:
          type: number
          nullable: true
        status:
          type: string
        unrealized_pnl:
          type: number
        realized_pnl:
          type: number
        transaction_costs:
          type: number
        stop_loss_price:
          type: number
          nullable: true
          description: Hard stop, or null when the lot carries none (the regime layer removed it at entry, or the lot came from a trailing re-entry).
        trailing_stop_active:
          type: boolean
        trailing_stop_price:
          type: number
          nullable: true
        highest_price:
          type: number
          nullable: true
        lowest_price:
          type: number
          nullable: true
        confidence_score:
          type: number
        exit_price:
          type: number
          nullable: true
        exit_timestamp:
          type: string
          nullable: true
        exit_reason:
          type: string
          description: |
            Why the lot closed: trailing_stop, hard_stop_loss, ai_signal_market, rotation, external_sale (sold outside the engine, booked at the venue's own fill), external_sale_unpriced (sold outside the engine, no usable fill — closed at the last mark). Empty while open.
        entry_regime_label:
          type: string
          nullable: true
        entry_regime_confidence:
          type: number
          nullable: true
        exit_regime_label:
          type: string
          nullable: true
        exit_regime_confidence:
          type: number
          nullable: true
        basis_source:
          type: string
          description: |
            Where the lot's cost basis came from. `traded`: this engine bought it and the entry is the real fill. `adopted`: found on the exchange and booked at the mark — its P&L is measured FROM ADOPTION, not lifetime. `reconstructed`: adopted, basis rebuilt from the venue's trade history.
        adopted_at:
          type: string
          nullable: true
        venue_market:
          type: string
          nullable: true
        entry_decision_id:
          type: string
          nullable: true
          description: |
            The decision that opened the lot (`DecisionSummary.decision_id`). Null for a trailing re-entry or an adopted holding — no decision was made.
        exit_decision_id:
          type: string
          nullable: true
          description: |
            The decision whose execution closed the lot. Null for a mechanical close (stop, trail, force-close) — read `exit_reason` instead.
      required: [id, symbol, side, quantity, entry_price, entry_timestamp, status, unrealized_pnl, realized_pnl, transaction_costs]
    OracleFill:
      type: object
      description: |
        One fill chained to a lot — the trade that actually moved money.
      properties:
        id:
          type: integer
        symbol:
          type: string
        side:
          type: string
        quantity:
          type: number
        price:
          type: number
        timestamp:
          type: string
        commission:
          type: number
        pnl:
          type: number
        pnl_pct:
          type: number
        reason:
          type: string
          nullable: true
          description: |
            The close reason for a SELL that closed a lot; `exchange_history` for ingested history rows.
        source:
          type: string
          description: |
            `engine` — an order this engine placed. `exchange` — the venue recorded it: history ingested at startup, or the close of a lot sold outside the engine.
        settle_currency:
          type: string
          nullable: true
        venue_market:
          type: string
          nullable: true
        decision_id:
          type: string
          nullable: true
          description: |
            The decision this fill executed; null for a mechanical or venue-side fill.
      required: [id, symbol, side, quantity, price, timestamp, commission, pnl, pnl_pct]
    CurvePointModel:
      type: object
      description: |
        One sample of a curve. `index` is 100 at the anchor so series of different
        scale share an axis; `value` is the underlying level (dollars for the book,
        the basket level for a benchmark).
      properties:
        timestamp:
          type: string
        index:
          type: number
        value:
          type: number
      required: [timestamp, index, value]
    FillMarkerModel:
      type: object
      description: One engine fill placed on the curve and linked to its decision.
      properties:
        timestamp:
          type: string
        symbol:
          type: string
        side:
          type: string
        price:
          type: number
        quantity:
          type: number
        pnl:
          type: number
          nullable: true
        pnl_pct:
          type: number
          nullable: true
        reason:
          type: string
          nullable: true
        position_id:
          type: integer
          nullable: true
        decision_id:
          type: string
          nullable: true
          description: Null for a mechanical exit (stop, trail) — there is no decision card to open.
        book_index:
          type: number
          nullable: true
          description: The book's index at that hour — where to draw the marker.
      required: [timestamp, symbol, side, price, quantity]
    EvaluationCurves:
      type: object
      description: |
        The book's equity beside the market on one hourly grid. Every series is
        indexed to 100 at `anchor` — the start of the latest stretch with no book
        rebuild in it (`anchored_on_rebuild` says whether that cut a deploy off) —
        because a comparison drawn across a rebuild is meaningless. `equal_weight`
        holds `basket` (symbols traded in the stretch) equal-weighted from the
        anchor; `exposure_matched` keeps the book's own cash fraction and puts the
        rest in the basket, rebalanced hourly — the fair rung for a 40–70%-invested
        book. Empty series with a `notes` entry mean "could not measure", never flat.
      properties:
        session_id:
          type: string
        mode:
          type: string
        window_start:
          type: string
        window_end:
          type: string
        anchor:
          type: string
          nullable: true
        end:
          type: string
          nullable: true
        anchored_on_rebuild:
          type: boolean
        basket:
          type: array
          items:
            type: string
        unavailable:
          type: array
          items:
            type: string
          description: Traded symbols the venue could not price at the anchor — not in the basket.
        equity:
          type: array
          items:
            $ref: '#/components/schemas/CurvePointModel'
        equal_weight:
          type: array
          items:
            $ref: '#/components/schemas/CurvePointModel'
        btc:
          type: array
          items:
            $ref: '#/components/schemas/CurvePointModel'
        exposure_matched:
          type: array
          items:
            $ref: '#/components/schemas/CurvePointModel'
        markers:
          type: array
          items:
            $ref: '#/components/schemas/FillMarkerModel'
        discontinuities:
          type: array
          items:
            type: object
            additionalProperties: true
        notes:
          type: array
          items:
            type: string
      required: [session_id, mode, window_start, window_end]
    DecisionSummary:
      type: object
      description: |
        One orchestrator decision and what the engine did with it — the card.
        `executed` is true only for a filled buy or a sell that closed lots; `outcome`
        names the path either way, so a declined buy says which gate declined it.
      properties:
        decision_id:
          type: string
          description: The orchestrator's workflow id; what lots and fills point at.
        decided_at:
          type: string
          description: The engine's clock when it decided — bar time in a backtest, wall clock live.
        symbol:
          type: string
        action:
          type: string
          description: buy, sell or hold (as the orchestrator emitted it).
        confidence:
          type: number
        position_size:
          type: number
          description: Dollar size after the orchestrator's adjustments (critic, floor, scaler).
        price:
          type: number
          nullable: true
          description: The engine's price for the symbol at decision time; null when it had none.
        executed:
          type: boolean
        outcome:
          type: string
          description: |
            `filled`, `closed_lots`, `hold`, `no_price`, `skipped_cycle_cap`, `gate_entry`,
            `gate_dual_portfolio`, `sized_to_zero`, `refused_before_rotation`, `gate_extension`,
            `gate_governor`, `no_order`, `guard_blocked`, `not_filled`, `no_lots_to_close`,
            `sell_bypassed_trend_up`, `sell_suppressed_protected`, `sell_not_filled`.
        outcome_detail:
          type: string
          nullable: true
        resolved_size:
          type: number
          nullable: true
          description: Dollar size after the engine's own sizing sequence, when it ran.
        position_id:
          type: integer
          nullable: true
          description: The lot this decision opened, when it did.
        reasoning:
          type: string
        stop_loss:
          type: number
          nullable: true
        take_profit:
          type: number
          nullable: true
        trail_stop_pct:
          type: number
          nullable: true
        pattern_confidence:
          type: number
        agent_consensus:
          type: number
        risk_score:
          type: number
        ml_p_profit:
          type: number
          nullable: true
        regime_label:
          type: string
          nullable: true
        regime_confidence:
          type: number
          nullable: true
        regime_weight:
          type: number
          nullable: true
          description: Continuous regime weight in [0, 1]; null means the legacy hard gate was in force.
        critic_agree:
          type: boolean
          nullable: true
        critic_reason_code:
          type: string
          nullable: true
        critic_parse_failed:
          type: boolean
          nullable: true
        pm_signal:
          type: string
          nullable: true
        mtf_is_choppy:
          type: boolean
          nullable: true
        mtf_trend_score:
          type: number
          nullable: true
      required: [decision_id, decided_at, symbol, action, confidence, position_size, executed, outcome]
    DecisionDetail:
      type: object
      description: |
        The full decision path for one decision. `context` is the typed DecisionContext
        the orchestrator attached — every agent's inputs (`signals`), the critic's verdict
        (`critic`), the regime read (`regime`), the position manager's raw output
        (`position_manager`), the multi-timeframe read (`mtf`) and `adjustments`: the
        sequence of steps (sell_critic, critic_modulate, confidence_floor, size_scale)
        with `fired` and size/confidence before and after each. Null for decisions
        recorded before the context existed.
      properties:
        session_id:
          type: string
        mode:
          type: string
          description: paper, real or backtest.
        decision:
          $ref: '#/components/schemas/DecisionSummary'
        context:
          type: object
          nullable: true
          additionalProperties: true
        features:
          type: object
          nullable: true
          additionalProperties:
            type: number
          description: ML-1 setup features at decision time.
        opened_lots:
          type: array
          items:
            $ref: '#/components/schemas/OracleLot'
        closed_lots:
          type: array
          items:
            $ref: '#/components/schemas/OracleLot'
        fills:
          type: array
          items:
            $ref: '#/components/schemas/OracleFill'
        trace_files:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Decision-trace files being written at the time (the raw archive); empty for a backtest.
      required: [session_id, mode, decision]
    DecisionsResponse:
      type: object
      description: A bounded page of decision records, newest first.
      properties:
        session_id:
          type: string
        mode:
          type: string
        total_matching:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/DecisionSummary'
      required: [session_id, mode, total_matching, limit, offset, decisions]
    LotLineage:
      type: object
      description: |
        The full chain for one lot: the position, its fills, and which decision-trace
        files were being written while it was open (the DB holds WHAT happened, the
        traces hold WHY).
      properties:
        session_id:
          type: string
        mode:
          type: string
        lot:
          $ref: #/components/schemas/OracleLot
        fills:
          type: array
          items:
            $ref: #/components/schemas/OracleFill
        trace_files:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Decision-trace files whose modification time falls inside [lineage_from, lineage_until]; each entry is {name, size_bytes, modified_at, covers_until}.
        lineage_from:
          type: string
        lineage_until:
          type: string
      required: [session_id, mode, lot, fills, lineage_from, lineage_until]
    OracleLotsResponse:
      type: object
      description: |
        A bounded page of the lot ledger.
      properties:
        session_id:
          type: string
        mode:
          type: string
        total_matching:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        lots:
          type: array
          items:
            $ref: #/components/schemas/OracleLot
      required: [session_id, mode, total_matching, limit, offset, lots]
    TraceFileInfo:
      type: object
      description: |
        One decision-trace file on disk for this session.
      properties:
        name:
          type: string
        size_bytes:
          type: integer
        modified_at:
          type: string
      required: [name, size_bytes, modified_at]
    TraceRecordsResponse:
      type: object
      description: |
        Server-side-slimmed trace records, filtered and capped. Prompt text is dropped
        unless keep_prompts was set, and even then capped per prompt.
      properties:
        session_id:
          type: string
        files_scanned:
          type: integer
        records_scanned:
          type: integer
        records:
          type: array
          items:
            type: object
            additionalProperties: true
          description: |
            Slimmed trace records: {timestamp, workflow_id, agent_id, type, content, result, metadata} with bulk fields dropped.
        truncated:
          type: boolean
        keep_prompts:
          type: boolean
      required: [session_id, files_scanned, records_scanned, records, truncated, keep_prompts]
    LlmCallsResponse:
      type: object
      description: |
        Recent entries of the SHARED LLM call log. The log carries symbol and agent but
        no session, so this answer is never session-scoped.
      properties:
        entries:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Raw llm_calls.jsonl rows, newest last.
        scanned_bytes:
          type: integer
      required: [entries, scanned_bytes]
    ContinuityGap:
      type: object
      description: |
        A stretch with no snapshots — the signature of an engine outage.
      properties:
        from_ts:
          type: string
        until_ts:
          type: string
        minutes:
          type: number
      required: [from_ts, until_ts, minutes]
    ContinuityReport:
      type: object
      description: |
        Snapshot continuity for a session: coverage, gaps, and rows whose total_value
        excluded unpriceable holdings (across those the equity curve is a floor, not a
        valuation).
      properties:
        session_id:
          type: string
        mode:
          type: string
        snapshot_count:
          type: integer
        first_snapshot:
          type: string
          nullable: true
        last_snapshot_ts:
          type: string
          nullable: true
        max_gap_minutes:
          type: number
        unpriced_rows:
          type: integer
          description: Snapshots whose total_value excluded unpriceable holdings — a drawdown read across them measures a ticker outage, not the book.
        gaps:
          type: array
          items:
            $ref: #/components/schemas/ContinuityGap
      required: [session_id, mode, snapshot_count, gaps]
    LogTailResponse:
      type: object
      description: |
        The last lines of the session's newest engine log — bounded by bytes read from
        the end of one file, never a whole file.
      properties:
        session_id:
          type: string
        file:
          type: string
        size_bytes:
          type: integer
        bytes_read:
          type: integer
        truncated:
          type: boolean
        lines:
          type: array
          items:
            type: string
      required: [session_id, file, size_bytes, bytes_read, truncated, lines]
